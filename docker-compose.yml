services:
  postgres:
    image: postgres:16
    container_name: memory-app-postgres
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory_app
    ports:
      - "5432:5432"
    volumes:
      - memory_app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory_app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  memory_app_pgdata:
